# Avtomatik generatsiya: `pnpm contract:build` (marshrutlar + zod sxemalar + haqiqiy javob misollari). Qo'lda tahrirlamang.
openapi: "3.0.3"
info:
  title: "Mahalladosh API"
  version: "0.2.0"
  description: "Mahalla aholisi (mobil ilova) va mahalla adminlari (veb-panel) uchun **yagona REST API**. Sana, ovozlar va holatlar bo'yicha manba — backend.\n\n## Tez boshlash\n1. **`POST /auth/login`** (`client: \"mobile\"`) — «Try it out» da tayyor misollar bor. Demo: aholi `ali.yunusobod`, admin `admin.yunusobod`, parol `Demo12345!` (`pnpm db:seed:demo`).\n2. Javobdagi **`token`** ni sahifa tepasidagi **Authorize** tugmasiga kiriting.\n3. Istalgan so'rovni sinang. Veb (cookie) rejimi brauzer ilovasi uchun: `client: \"web\"` + `X-CSRF-Token`.\n\n## Rollar (TZ 2)\n| Belgi | Ma'no |\n| --- | --- |\n| ochiq | kirish talab qilinmaydi |\n| har qanday kirgan | aholi ham, admin ham |\n| aholi | `RESIDENT` — o'z mahallasida post yuboradi, ovoz beradi, izoh/shikoyat qoldiradi, tadbirga yoziladi |\n| admin | `MAHALLA_ADMIN` — faqat o'z mahallasida: akkaunt, moderatsiya, ish yuritish, tadbir va e'lon |\n\n**Mahalla ID so'rovda yuborilmaydi** — sessiyadan olinadi. Boshqa mahalla obyekti (post, media, chat, tadbir, bildirishnoma, admin amali) ID orqali ham **`404`**.\nBirinchi kirishda (vaqtinchalik parol) faqat `GET /me`, `POST /auth/change-password`, `POST /auth/logout` ishlaydi; qolgani `403 PASSWORD_CHANGE_REQUIRED`.\n\n## Post holatlari (TZ 4)\n| Tizim holati | Aholi ko'radigan yozuv (`statusLabel`) | Keyingi holat |\n| --- | --- | --- |\n| `PENDING_REVIEW` | Moderatsiyada | admin: `OPEN` / `REJECTED` / `MERGED` |\n| `REJECTED` | Tuzatish kerak | muallif tahrirlab qayta yuboradi → `PENDING_REVIEW` |\n| `OPEN` | Ochiq; joriy davrda bo'lsa **Ovoz berilmoqda** | faqat oy yakuni → `SELECTED` |\n| `SELECTED` | Oylik ovozda tanlandi | admin → `IN_PROGRESS` (mas'ul, qadam, muddat majburiy) |\n| `IN_PROGRESS` | Jarayonda | admin → `REFERRED` (tashkilot, sana, keyingi tekshiruv) yoki `RESOLVED` (yakun matni) |\n| `REFERRED` | Tashkilotdan javob kutilmoqda | admin → `IN_PROGRESS` / `RESOLVED` |\n| `RESOLVED` | Hal qilindi | admin → `IN_PROGRESS` (sabab majburiy); muallif fikr bildiradi |\n\n`MERGED` — dublikat (asosiy postga bog'langan). Yashirish **status emas**: `hidden` belgisi. Ruxsat etilmagan o'tish → `409 INVALID_STATUS_TRANSITION`.\n\n## Oylik ovoz (TZ 4)\n- Davr — Toshkent (UTC+5) bo'yicha kalendar oy; vaqtlar UTC (ISO 8601). Har oy **3 ovoz**, postga **1 ovoz**; davr yopilguncha ovozni qaytarib olish mumkin.\n- Xatolar: `ROUND_CLOSED`, `ISSUE_NOT_VOTABLE`, `VOTE_LIMIT_REACHED`. Takroriy so'rov ovozni ikki marta sanamaydi; parallel so'rovlar limitni buzmaydi.\n- Oy yakuni **avtomatik** (idempotent): eng ko'p ovoz → `SELECTED`; teng bo'lsa ertaroq nashr qilingani, keyin kichik ID; ovoz yo'q → «Bu oy g'olib aniqlanmadi». Admin g'olibni almashtira olmaydi; davrni erta yopish API'da **yo'q**.\n\n## Media (TZ 3, 8)\n`POST /media` (multipart) → `mediaId`, keyin `POST /issues { mediaIds }`. Rasm JPEG/PNG/WebP ≤ 5 MB (HEIC → JPEG qilib yuboring), video MP4/QuickTime ≤ 25 MB; postga ≤ 3 rasm va ≤ 1 video. Server EXIF/GPS'ni o'chiradi. O'qish URL'lari **5 daqiqa** amal qiladi, yashirilgan post media'si oddiy foydalanuvchiga berilmaydi.\n\n## Umumiy qoidalar\n- **Xato formati**: `{ \"error\": { \"code\", \"message\", \"details\" } }`; `message` — o'zbek lotin; validatsiyada `details.fields`.\n- **Sahifalash**: `?cursor=&limit=` (standart 20, ko'pi 50) → `{ items, nextCursor }` (`null` — tugagan).\n- **Idempotentlik**: `POST /issues` — `Idempotency-Key` header; media — `clientUploadId`; chat — `clientMessageId`.\n- **Tezlik chegaralari**: login IP bo'yicha 20/10 daq, bitta login 5 xato → 15 daq blok; umumiy 300/daq; post 10/soat; chat 30/daq; shikoyat 20/soat (`429` + `Retry-After`).\n- **Realtime chat**: Socket.IO `/chat` (`message:new`, `message:hidden`); xabar yuborish REST orqali.\n- **Push**: `PUT /devices`; `data = { notificationId, type, entityType, entityId }`."
servers:
  - url: "http://localhost:3000/api/v1"
    description: "Lokal API (iOS simulyator, veb)"
  - url: "http://10.0.2.2:3000/api/v1"
    description: "Android emulyator"
  - url: "http://localhost:4010/api/v1"
    description: "Prism mock (pnpm contract:mock)"
tags:
  - name: "Auth"
    description: "TZ 2. Kirish (mobil token / veb cookie), vaqtinchalik parol, parol almashtirish, sessiya, qurilma tokeni."
  - name: "Admin: kirish so'rovlari"
  - name: "Bosh sahifa"
    description: "TZ 6. Mobil bosh sahifa: ovoz muddati, g'olib yoki jarayondagi muammo, navbatdagi tadbir, muhim e'lon — bitta so'rovda."
  - name: "Muammolar"
    description: "TZ 3. Post yuborish, lenta (toifa, holat, joriy oy, saralash), post sahifasi, izohlar, kuzatish, muallif fikri."
  - name: "Ovoz"
    description: "TZ 4. Oylik davr, 3 ovoz, ovozni qaytarish, davrlar tarixi va natija."
  - name: "Admin: davrlar"
    description: "TZ 4. Davrlar va natijalar (g'olibni qo'lda almashtirish endpointi yo'q)."
  - name: "Media"
    description: "TZ 3, 8. Rasm/video yuklash va qisqa muddatli o'qish URL'i."
  - name: "Chat"
    description: "TZ 5. Mahallaning bitta umumiy matnli chati (tarix, kursor, idempotent yuborish)."
  - name: "Support"
  - name: "Admin: support chat"
  - name: "Shikoyatlar"
    description: "TZ 3, 5. Aholi post, izoh yoki chat xabari ustidan shikoyat yuboradi."
  - name: "Admin: moderatsiya"
    description: "TZ 3. Moderatsiya navbati, tasdiqlash/rad etish/birlashtirish, shikoyatlar, kontentni yashirish."
  - name: "Tadbirlar"
    description: "TZ 5. Tadbirlar ro'yxati, tafsiloti, «Qatnashaman»."
  - name: "Admin: tadbirlar"
    description: "TZ 5. Tadbir yaratish, nashr, tahrir, bekor qilish, yakunlash, qatnashchilar."
  - name: "E'lonlar"
    description: "TZ 5. E'lonlar (nashr qilinganlar)."
  - name: "Admin: e'lonlar"
    description: "TZ 5. Qoralama, nashr (muhim e'lon → bildirishnoma/push), o'chirish."
  - name: "Bildirishnomalar"
    description: "TZ 5. Ilova ichidagi bildirishnomalar, o'qilmaganlar soni, o'qilgan deb belgilash."
  - name: "Admin: aholi"
    description: "TZ 2. Akkaunt yaratish (vaqtinchalik parol bir marta ko'rsatiladi), parolni qayta chiqarish, bloklash."
  - name: "Admin: muammolar"
    description: "TZ 4. Ish yuritish: IN_PROGRESS → REFERRED → RESOLVED, mas'ul/muddat o'zgarishi, keyingi davrga o'tkazish."
  - name: "Admin"
    description: "TZ 6. Dashboard va amallar jurnali (audit)."
  - name: "Tizim"
    description: "Liveness va readiness (prefikssiz)."
paths:
  "/health":
    servers:
      - url: "http://localhost:3000"
    get:
      tags:
        - "Tizim"
      summary: "Liveness: jarayon tirik (bog‘liqliklarga qaramaydi)"
      operationId: "getHealth"
      responses:
        "200":
          description: "Tirik"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "status"
                properties:
                  status:
                    type: "string"
                    enum:
                      - "ok"
              example:
                status: "ok"
  "/ready":
    servers:
      - url: "http://localhost:3000"
    get:
      tags:
        - "Tizim"
      summary: "Readiness: DB, kesh va saqlash alohida hisobot qilinadi"
      operationId: "getReady"
      responses:
        "200":
          description: "Hammasi ishlayapti"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ready"
              example:
                status: "ok"
                checks:
                  db: "ok"
                  cache: "ok"
                  storage: "ok"
        "503":
          description: "Kamida bitta bog‘liqlik ishlamayapti"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ready"
              example:
                status: "fail"
                checks:
                  db: "ok"
                  cache: "fail"
                  storage: "ok"
  "/auth/login":
    post:
      tags:
        - "Auth"
      summary: "Kirish (mobil: Bearer token, veb: HttpOnly cookie)"
      description: "**Rol:** ochiq (kirish shart emas)\n\nMobil: `{ token, user, mustChangePassword }`. Veb: `Set-Cookie: mhd_session` + `mhd_csrf` va `{ user, mustChangePassword }`. Bitta login uchun 5 ketma-ket xato -> 15 daqiqa blok (429 TOO_MANY_ATTEMPTS)."
      operationId: "postAuthLogin"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                login:
                  type: "string"
                  minLength: 1
                  maxLength: 64
                password:
                  type: "string"
                  minLength: 1
                  maxLength: 200
                client:
                  type: "string"
                  enum:
                    - "mobile"
                    - "web"
              required:
                - "login"
                - "password"
                - "client"
            examples:
              aholi:
                summary: "Aholi (mobil)"
                value:
                  login: "ali.yunusobod"
                  password: "Demo12345!"
                  client: "mobile"
              admin:
                summary: "Admin (mobil token)"
                value:
                  login: "admin.yunusobod"
                  password: "Demo12345!"
                  client: "mobile"
              veb:
                summary: "Veb (cookie + CSRF)"
                value:
                  login: "admin.yunusobod"
                  password: "Demo12345!"
                  client: "web"
              birinchi:
                summary: "Birinchi kirish (vaqtinchalik parol → mustChangePassword: true)"
                value:
                  login: "dilnoza.yunusobod"
                  password: "Temp12345!"
                  client: "mobile"
      responses:
        "200":
          description: "Muvaffaqiyatli"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  token:
                    description: "Faqat mobil (client=mobile)"
                    type: "string"
                  user:
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      login:
                        type: "string"
                      displayName:
                        type: "string"
                      phone:
                        nullable: true
                        type: "string"
                      role:
                        type: "string"
                        enum:
                          - "RESIDENT"
                          - "MAHALLA_ADMIN"
                      mahalla:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                            format: "uuid"
                            pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                          name:
                            type: "string"
                          slug:
                            type: "string"
                        required:
                          - "id"
                          - "name"
                          - "slug"
                        additionalProperties: false
                    required:
                      - "id"
                      - "login"
                      - "displayName"
                      - "phone"
                      - "role"
                      - "mahalla"
                    additionalProperties: false
                  mustChangePassword:
                    type: "boolean"
                required:
                  - "user"
                  - "mustChangePassword"
                additionalProperties: false
              example:
                token: "Zk3QXw0hY1mJb7pS4nVd8eAcF2uLgT9rKiOyWq5Ni_M"
                user:
                  id: "01a20ed7-12f9-7478-85a2-5c190142deb4"
                  login: "ali.yunusobod"
                  displayName: "Ali Valiyev"
                  phone: "+998903112598"
                  role: "RESIDENT"
                  mahalla:
                    id: "01a20ed7-12f3-776a-a746-ac1a8f9ee8a9"
                    name: "Demo Yunusobod"
                    slug: "demo-yunusobod"
                mustChangePassword: false
        "400":
          description: "**VALIDATION_ERROR** — So'rov ma'lumotlari noto'g'ri"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                VALIDATION_ERROR:
                  summary: "VALIDATION_ERROR"
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "So'rov ma'lumotlari noto'g'ri"
                      details:
                        fields:
                          title: "5–120 belgi bo'lsin"
        "401":
          description: "**INVALID_CREDENTIALS** — Login yoki parol noto'g'ri\n\n**TEMP_PASSWORD_EXPIRED** — Vaqtinchalik parol muddati tugagan. Mahalla adminiga murojaat qiling"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                INVALID_CREDENTIALS:
                  summary: "INVALID_CREDENTIALS"
                  value:
                    error:
                      code: "INVALID_CREDENTIALS"
                      message: "Login yoki parol noto'g'ri"
                      details: {}
                TEMP_PASSWORD_EXPIRED:
                  summary: "TEMP_PASSWORD_EXPIRED"
                  value:
                    error:
                      code: "TEMP_PASSWORD_EXPIRED"
                      message: "Vaqtinchalik parol muddati tugagan. Mahalla adminiga murojaat qiling"
                      details: {}
        "403":
          description: "**FORBIDDEN** — Bu amal uchun ruxsat yo'q"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                FORBIDDEN:
                  summary: "FORBIDDEN"
                  value:
                    error:
                      code: "FORBIDDEN"
                      message: "Bu amal uchun ruxsat yo'q"
                      details: {}
        "429":
          description: "**TOO_MANY_ATTEMPTS** — Juda ko'p urinish. Birozdan keyin qayta urinib ko'ring\n\n**RATE_LIMITED** — Juda ko'p so'rov. Birozdan keyin qayta urinib ko'ring"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                TOO_MANY_ATTEMPTS:
                  summary: "TOO_MANY_ATTEMPTS"
                  value:
                    error:
                      code: "TOO_MANY_ATTEMPTS"
                      message: "Juda ko'p urinish. Birozdan keyin qayta urinib ko'ring"
                      details: {}
                RATE_LIMITED:
                  summary: "RATE_LIMITED"
                  value:
                    error:
                      code: "RATE_LIMITED"
                      message: "Juda ko'p so'rov. Birozdan keyin qayta urinib ko'ring"
                      details: {}
      security: []
      "x-role": "public"
  "/auth/logout":
    post:
      tags:
        - "Auth"
      summary: "Chiqish (joriy sessiyani bekor qiladi)"
      description: "**Rol:** har qanday kirgan foydalanuvchi (aholi yoki admin)"
      operationId: "postAuthLogout"
      responses:
        "204":
          description: "Muvaffaqiyatli (javob tanasi yo'q)"
        "401":
          description: "**UNAUTHENTICATED** — Tizimga kirish talab qilinadi"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                UNAUTHENTICATED:
                  summary: "UNAUTHENTICATED"
                  value:
                    error:
                      code: "UNAUTHENTICATED"
                      message: "Tizimga kirish talab qilinadi"
                      details: {}
        "403":
          description: "**FORBIDDEN** — Bu amal uchun ruxsat yo'q\n\n**CSRF_INVALID** — Xavfsizlik tekshiruvidan o'tmadi. Sahifani yangilang"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                FORBIDDEN:
                  summary: "FORBIDDEN"
                  value:
                    error:
                      code: "FORBIDDEN"
                      message: "Bu amal uchun ruxsat yo'q"
                      details: {}
                CSRF_INVALID:
                  summary: "CSRF_INVALID"
                  value:
                    error:
                      code: "CSRF_INVALID"
                      message: "Xavfsizlik tekshiruvidan o'tmadi. Sahifani yangilang"
                      details: {}
        "429":
          description: "**RATE_LIMITED** — Juda ko'p so'rov. Birozdan keyin qayta urinib ko'ring"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                RATE_LIMITED:
                  summary: "RATE_LIMITED"
                  value:
                    error:
                      code: "RATE_LIMITED"
                      message: "Juda ko'p so'rov. Birozdan keyin qayta urinib ko'ring"
                      details: {}
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "user"
  "/auth/change-password":
    post:
      tags:
        - "Auth"
      summary: "Parolni almashtirish (joriy sessiyadan boshqalari bekor qilinadi)"
      description: "**Rol:** har qanday kirgan foydalanuvchi (aholi yoki admin)"
      operationId: "postAuthChangePassword"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                currentPassword:
                  type: "string"
                  minLength: 1
                  maxLength: 200
                newPassword:
                  type: "string"
                  minLength: 8
                  maxLength: 200
              required:
                - "currentPassword"
                - "newPassword"
            examples:
              oddiy:
                summary: "Yangi parol (kamida 8 belgi)"
                value:
                  currentPassword: "Temp12345!"
                  newPassword: "YangiParol2026"
      responses:
        "204":
          description: "Muvaffaqiyatli (javob tanasi yo'q)"
        "400":
          description: "**VALIDATION_ERROR** — So'rov ma'lumotlari noto'g'ri"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                VALIDATION_ERROR:
                  summary: "VALIDATION_ERROR"
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "So'rov ma'lumotlari noto'g'ri"
                      details:
                        fields:
                          title: "5–120 belgi bo'lsin"
        "401":
          description: "**UNAUTHENTICATED** — Tizimga kirish talab qilinadi"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                UNAUTHENTICATED:
                  summary: "UNAUTHENTICATED"
                  value:
                    error:
                      code: "UNAUTHENTICATED"
                      message: "Tizimga kirish talab qilinadi"
                      details: {}
        "403":
          description: "**FORBIDDEN** — Bu amal uchun ruxsat yo'q\n\n**CSRF_INVALID** — Xavfsizlik tekshiruvidan o'tmadi. Sahifani yangilang"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                FORBIDDEN:
                  summary: "FORBIDDEN"
                  value:
                    error:
                      code: "FORBIDDEN"
                      message: "Bu amal uchun ruxsat yo'q"
                      details: {}
                CSRF_INVALID:
                  summary: "CSRF_INVALID"
                  value:
                    error:
                      code: "CSRF_INVALID"
                      message: "Xavfsizlik tekshiruvidan o'tmadi. Sahifani yangilang"
                      details: {}
        "429":
          description: "**RATE_LIMITED** — Juda ko'p so'rov. Birozdan keyin qayta urinib ko'ring"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                RATE_LIMITED:
                  summary: "RATE_LIMITED"
                  value:
                    error:
                      code: "RATE_LIMITED"
                      message: "Juda ko'p so'rov. Birozdan keyin qayta urinib ko'ring"
                      details: {}
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "user"
  "/me":
    get:
      tags:
        - "Auth"
      summary: "Joriy foydalanuvchi"
      description: "**Rol:** har qanday kirgan foydalanuvchi (aholi yoki admin)"
      operationId: "getMe"
      responses:
        "200":
          description: "Muvaffaqiyatli"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  user:
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      login:
                        type: "string"
                      displayName:
                        type: "string"
                      phone:
                        nullable: true
                        type: "string"
                      role:
                        type: "string"
                        enum:
                          - "RESIDENT"
                          - "MAHALLA_ADMIN"
                      mahalla:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                            format: "uuid"
                            pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                          name:
                            type: "string"
                          slug:
                            type: "string"
                        required:
                          - "id"
                          - "name"
                          - "slug"
                        additionalProperties: false
                    required:
                      - "id"
                      - "login"
                      - "displayName"
                      - "phone"
                      - "role"
                      - "mahalla"
                    additionalProperties: false
                  mahalla:
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      name:
                        type: "string"
                      slug:
                        type: "string"
                    required:
                      - "id"
                      - "name"
                      - "slug"
                    additionalProperties: false
                  role:
                    type: "string"
                    enum:
                      - "RESIDENT"
                      - "MAHALLA_ADMIN"
                  mustChangePassword:
                    type: "boolean"
                  unreadNotifications:
