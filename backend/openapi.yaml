components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "Mobil: `Authorization: Bearer <opaque token>` (`POST /auth/login`, `client: \"mobile\"`)"
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "mhd_session"
      description: "Veb: HttpOnly cookie; o'zgartiruvchi so'rovlarda `X-CSRF-Token` = `mhd_csrf` cookie qiymati va `Origin`"
  schemas:
    ErrorCode:
      type: "string"
      enum:
        - "VALIDATION_ERROR"
        - "UNAUTHENTICATED"
        - "INVALID_CREDENTIALS"
        - "TEMP_PASSWORD_EXPIRED"
        - "FORBIDDEN"
        - "PASSWORD_CHANGE_REQUIRED"
        - "CSRF_INVALID"
        - "NOT_FOUND"
        - "CONFLICT"
        - "INVALID_STATUS_TRANSITION"
        - "ROUND_CLOSED"
        - "ISSUE_NOT_VOTABLE"
        - "VOTE_LIMIT_REACHED"
        - "FILE_TOO_LARGE"
        - "UNSUPPORTED_MEDIA_TYPE"
        - "TOO_MANY_ATTEMPTS"
        - "RATE_LIMITED"
        - "INTERNAL_ERROR"
        - "SERVICE_UNAVAILABLE"
    ErrorResponse:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
            - "details"
          properties:
            code:
              "$ref": "#/components/schemas/ErrorCode"
            message:
              type: "string"
              description: "O'zbek lotin"
            details:
              type: "object"
              additionalProperties: true
              description: "VALIDATION_ERROR da `fields`: { maydon: xabar }"
      example:
        error:
          code: "VOTE_LIMIT_REACHED"
          message: "Bu oy uchun 3 ta ovozingizdan foydalandingiz"
          details: {}
    Ready:
      type: "object"
      required:
        - "status"
        - "checks"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
            - "fail"
        checks:
          type: "object"
          required:
            - "db"
            - "cache"
            - "storage"
          properties:
            db:
              type: "string"
              enum:
                - "ok"
                - "fail"
            cache:
              type: "string"
              enum:
                - "ok"
                - "fail"
            storage:
              type: "string"
              enum:
                - "ok"
                - "fail"
