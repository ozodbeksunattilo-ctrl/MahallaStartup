  "/admin/issues/{id}/transition":
    post:
      tags:
        - "Admin: muammolar"
      summary: "Holatni o'tkazish: IN_PROGRESS / REFERRED / RESOLVED (majburiy maydonlar holatga bog'liq)"
      description: "**Rol:** mahalla admini (`MAHALLA_ADMIN`)\n\nIN_PROGRESS: responsible, nextStep, dueDate. REFERRED: referredOrg, referredAt, followUpAt. RESOLVED: resolutionText (+ixtiyoriy mediaIds). RESOLVED -> IN_PROGRESS: reason. Boshqa o'tish -> 409 INVALID_STATUS_TRANSITION."
      operationId: "postAdminIssuesByIdTransition"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                toStatus:
                  type: "string"
                  enum:
                    - "PENDING_REVIEW"
                    - "OPEN"
                    - "REJECTED"
                    - "MERGED"
                    - "SELECTED"
                    - "IN_PROGRESS"
                    - "REFERRED"
                    - "RESOLVED"
                reason:
                  type: "string"
                  minLength: 3
                  maxLength: 500
                responsible:
                  type: "string"
                  minLength: 2
                  maxLength: 150
